# Implementation Handoff Document Schema
# Version: 1.0
# Used in: Implementation Handoff workflow
# Validated by: Chair, Parliamentarian, Handoff Validator tool

$schema: "http://json-schema.org/draft-07/schema#"
title: Implementation Handoff Document
description: Schema for handoff documents bridging Committee to Agentic system
version: "1.0"

type: object
required:
  - session_reference
  - implementation_specification
  - constitutional_requirements
  - handoff_routing
  - ratification_requirements
  - signatures

properties:
  session_reference:
    type: object
    description: "Reference to the committee session and decision"
    required:
      - session_id
      - decision_id
      - date
      - vote_summary
    properties:
      session_id:
        type: string
        pattern: "^\\d{4}-\\d{2}-\\d{2}_\\d{3}_[a-z-]+$"
      decision_id:
        type: string
        pattern: "^DEC-\\d{4}-\\d{2}-\\d{2}-\\d{3}$"
      date:
        type: string
        format: date
      vote_summary:
        type: string
        description: "e.g., '12 for, 1 opposed, 2 abstained'"

  implementation_specification:
    type: object
    description: "What the Agentic system must implement"
    required:
      - objective
      - success_criteria
      - architectural_decisions
      - out_of_scope
    properties:
      objective:
        type: string
        description: "One clear sentence describing what must be built"
        minLength: 20
        maxLength: 500
      
      success_criteria:
        type: array
        description: "Testable criteria for implementation success"
        minItems: 3
        items:
          type: object
          required:
            - criterion
            - testable
          properties:
            criterion:
              type: string
            testable:
              type: boolean
              description: "Can we write a test for this?"
            test_hint:
              type: string
              description: "How to test this criterion"
      
      architectural_decisions:
        type: array
        description: "Binding decisions from committee deliberation"
        minItems: 1
        items:
          type: object
          required:
            - decision
            - rationale
          properties:
            decision:
              type: string
            rationale:
              type: string
            challenger:
              type: string
              description: "Which critic challenged this"
            response:
              type: string
              description: "How challenge was addressed"
      
      out_of_scope:
        type: array
        description: "Items explicitly NOT to be implemented"
        items:
          type: string

  legacy_alignment:
    type: object
    description: "Legacy compatibility requirements (required for Classic domain)"
    properties:
      applicable:
        type: boolean
        description: "Is this a Classic domain feature?"
      legacy_reference:
        type: string
        description: "Path to Loopback2 model file"
        example: "roadrunner_samples/receivable.js"
      behaviors:
        type: array
        description: "Legacy behaviors that must be matched"
        items:
          type: object
          required:
            - behavior
            - must_match
          properties:
            behavior:
              type: string
            must_match:
              type: boolean
            evidence:
              type: string
              description: "Line number or reference"

  constitutional_requirements:
    type: object
    description: "How constitutional rules apply to this implementation"
    required:
      - legacy_compatibility
      - decimal_for_money
      - tenant_isolation
      - state_machine
      - performance_budget
    properties:
      legacy_compatibility:
        type: object
        required:
          - applicable
        properties:
          applicable:
            type: boolean
          requirements:
            type: array
            items:
              type: string
      
      decimal_for_money:
        type: object
        required:
          - applicable
        properties:
          applicable:
            type: boolean
          fields:
            type: array
            description: "Financial fields that must use Decimal"
            items:
              type: string
      
      tenant_isolation:
        type: object
        required:
          - tenant_field
        properties:
          tenant_field:
            type: string
            enum:
              - owner_id
              - workspace_id
          requirements:
            type: array
            items:
              type: string
      
      state_machine:
        type: object
        required:
          - applicable
        properties:
          applicable:
            type: boolean
          valid_statuses:
            type: array
            items:
              type: string
          transitions:
            type: array
            items:
              type: string
              description: "e.g., 'created -> active'"
      
      performance_budget:
        type: array
        description: "Performance targets for operations"
        items:
          type: object
          required:
            - operation
            - target_ms
            - max_queries
          properties:
            operation:
              type: string
            target_ms:
              type: integer
            max_queries:
              type: integer

  handoff_routing:
    type: object
    description: "Where in the Agentic system to route this"
    required:
      - target_lifecycle
      - entry_point
    properties:
      target_lifecycle:
        type: string
        description: "Path to lifecycle documentation"
        example: "docs/agents/architecture/lifecycles/receivable_lifecycle/"
      entry_point:
        type: string
        description: "Command to invoke"
        example: "/arch-manager"
      assigned_gaps:
        type: array
        description: "Existing gap IDs to address"
        items:
          type: string
          pattern: "^GAP-\\d{3}$"
      affected_files:
        type: array
        description: "Files likely to be changed"
        items:
          type: string

  ratification_requirements:
    type: object
    description: "What committee needs to see for ratification"
    required:
      - evidence_required
      - reviewers
    properties:
      evidence_required:
        type: array
        description: "What must be demonstrated"
        items:
          type: string
      reviewers:
        type: array
        description: "Members who will review"
        items:
          type: object
          required:
            - member_id
            - role
          properties:
            member_id:
              type: string
            name:
              type: string
            role:
              type: string
      timeline:
        type: string
        description: "Expected timeline for implementation"

  signatures:
    type: object
    description: "Sign-off from responsible parties"
    required:
      - chair
      - parliamentarian
    properties:
      chair:
        type: object
        required:
          - member_id
          - signed
        properties:
          member_id:
            type: string
          name:
            type: string
          signed:
            type: boolean
          date:
            type: string
            format: date
      parliamentarian:
        type: object
        description: "Certifies constitutional compliance"
        required:
          - member_id
          - certified
        properties:
          member_id:
            type: string
          name:
            type: string
          certified:
            type: boolean
          date:
            type: string
            format: date
      domain_expert:
        type: object
        description: "Confirms technical accuracy"
        properties:
          member_id:
            type: string
          name:
            type: string
          confirmed:
            type: boolean
          date:
            type: string
            format: date

# Example valid document
example:
  session_reference:
    session_id: "2026-01-14_001_receivable-sync"
    decision_id: "DEC-2026-01-14-001"
    date: "2026-01-14"
    vote_summary: "12 for, 1 opposed, 2 abstained"
  
  implementation_specification:
    objective: "Implement Receivable sync reactor that validates, transforms, and persists receivable records from Classic MySQL to maintain bidirectional compatibility."
    success_criteria:
      - criterion: "Receivable created in Ash can be read by Loopback2"
        testable: true
        test_hint: "Create via Ash, query via raw MySQL matching LB2 model"
      - criterion: "All financial fields use Decimal type"
        testable: true
        test_hint: "Schema inspection and calculation precision test"
      - criterion: "Sync completes in under 150ms for single record"
        testable: true
        test_hint: "Performance test with timing assertions"
    architectural_decisions:
      - decision: "Use Ash.Reactor for sync workflow"
        rationale: "Provides compensation and clear step separation"
        challenger: "C004 - Dr. James Morrison"
        response: "Multi-step validation justifies Reactor over simple actions"
    out_of_scope:
      - "Batch sync of multiple receivables"
      - "UI components for sync status"
  
  constitutional_requirements:
    legacy_compatibility:
      applicable: true
      requirements:
        - "Column names match Loopback2 model"
        - "Status values are string-compatible"
    decimal_for_money:
      applicable: true
      fields:
        - "amount"
        - "balance"
        - "paid_amount"
    tenant_isolation:
      tenant_field: "owner_id"
      requirements:
        - "All queries include owner_id filter"
    state_machine:
      applicable: true
      valid_statuses:
        - "created"
        - "active"
        - "inactive"
      transitions:
        - "created -> active"
        - "active -> inactive"
        - "inactive -> active"
    performance_budget:
      - operation: "Single record sync"
        target_ms: 150
        max_queries: 3
  
  handoff_routing:
    target_lifecycle: "docs/agents/architecture/lifecycles/receivable_lifecycle/"
    entry_point: "/arch-manager"
    assigned_gaps:
      - "GAP-001"
    affected_files:
      - "lib/flame_ps_ar/classic/domain/receivable.ex"
      - "lib/flame_ps_ar/classic/domain/receivable/sync_reactor.ex"
  
  ratification_requirements:
    evidence_required:
      - "Passing round-trip compatibility test"
      - "Performance benchmark results"
      - "Implementation log from Coder"
    reviewers:
      - member_id: "DE001"
        name: "Jonathan Blake"
        role: "Domain Expert - Receivables"
      - member_id: "C001"
        name: "Dr. Victor Kozlov"
        role: "Legacy Alignment Adversary"
    timeline: "1-2 days"
  
  signatures:
    chair:
      member_id: "L001"
      name: "Dr. Alexandra Chen"
      signed: true
      date: "2026-01-14"
    parliamentarian:
      member_id: "L003"
      name: "Judge Helena Thornton"
      certified: true
      date: "2026-01-14"
    domain_expert:
      member_id: "DE001"
      name: "Jonathan Blake"
      confirmed: true
      date: "2026-01-14"

